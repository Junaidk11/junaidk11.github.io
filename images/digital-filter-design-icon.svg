<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="filterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="responseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Input Signal (noisy waveform - left side) -->
  <g transform="translate(40, 70)">
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c" font-weight="bold">INPUT</text>
    <!-- Noisy signal -->
    <path d="M -15,0 L -12,8 L -9,-5 L -6,12 L -3,-8 L 0,15 L 3,-6 L 6,10 L 9,-4 L 12,7 L 15,-2" 
          stroke="url(#inputGradient)" stroke-width="2" fill="none"/>
    <!-- High frequency noise -->
    <path d="M -15,0 L -14,2 L -13,-2 L -12,1 L -11,-1 L -10,2 L -9,-1 L -8,1 L -7,-2 L -6,2 L -5,-1 L -4,1 L -3,-2 L -2,2 L -1,-1 L 0,1 L 1,-2 L 2,2 L 3,-1 L 4,1 L 5,-2 L 6,2 L 7,-1 L 8,1 L 9,-2 L 10,2 L 11,-1 L 12,1 L 13,-2 L 14,2 L 15,-1" 
          stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Digital Filter (center) -->
  <g transform="translate(100, 100)">
    <!-- Filter box -->
    <rect x="-25" y="-20" width="50" height="40" rx="5" fill="url(#filterGradient)" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Filter type indicators -->
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">DIGITAL</text>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">FILTER</text>
    
    <!-- Filter characteristics -->
    <g transform="translate(-15, 8)" fill="white" font-family="Arial, sans-serif" font-size="5">
      <text x="0" y="0">H(z)</text>
    </g>
    <g transform="translate(8, 8)" fill="white" font-family="Arial, sans-serif" font-size="5">
      <text x="0" y="0">ωc</text>
    </g>
    
    <!-- Input/Output arrows -->
    <polygon points="-35,0 -28,-3 -28,3" fill="#95a5a6"/>
    <polygon points="28,0 35,-3 35,3" fill="#95a5a6"/>
  </g>
  
  <!-- Output Signal (clean waveform - right side) -->
  <g transform="translate(160, 70)">
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1abc9c" font-weight="bold">OUTPUT</text>
    <!-- Clean filtered signal -->
    <path d="M -15,0 Q -7,10 0,5 Q 7,-8 15,0" 
          stroke="url(#outputGradient)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Frequency Response (top) -->
  <g transform="translate(100, 50)">
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f39c12" font-weight="bold">FREQUENCY RESPONSE</text>
    
    <!-- Magnitude response curve (Butterworth-like) -->
    <rect x="-30" y="-8" width="60" height="16" rx="2" fill="rgba(52, 73, 94, 0.8)" stroke="#f39c12" stroke-width="1"/>
    
    <!-- Response curve -->
    <path d="M -25,0 L -15,0 L -10,0 L -5,0 L 0,-2 L 5,-5 L 10,-8 L 15,-10 L 25,-12" 
          stroke="url(#responseGradient)" stroke-width="2" fill="none"/>
    
    <!-- Cutoff frequency marker -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#f39c12" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="2" y="6" font-family="Arial, sans-serif" font-size="5" fill="#f39c12">fc</text>
  </g>
  
  <!-- Filter Types (left side) -->
  <g transform="translate(45, 130)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="rgba(52, 73, 94, 0.8)" stroke="#3498db" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#3498db" font-weight="bold">BUTTERWORTH</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#3498db">CHEBYSHEV</text>
  </g>
  
  <!-- DSP Operations (right side) -->
  <g transform="translate(155, 130)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="rgba(52, 73, 94, 0.8)" stroke="#1abc9c" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#1abc9c" font-weight="bold">LP • HP</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#1abc9c">BP • BS</text>
  </g>
  
  <!-- Z-transform representation (bottom-left) -->
  <g transform="translate(60, 160)">
    <circle cx="0" cy="0" r="12" fill="rgba(52, 73, 94, 0.8)" stroke="#e74c3c" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c" font-weight="bold">Z</text>
    <text x="0" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#bdc3c7">Z-DOMAIN</text>
  </g>
  
  <!-- Pole-Zero plot (bottom-right) -->
  <g transform="translate(140, 160)">
    <!-- Unit circle -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Poles (x) -->
    <g stroke="#e74c3c" stroke-width="2">
      <line x1="-3" y1="-3" x2="3" y2="3"/>
      <line x1="-3" y1="3" x2="3" y2="-3"/>
    </g>
    <g stroke="#e74c3c" stroke-width="2" transform="translate(0, 6)">
      <line x1="-3" y1="-3" x2="3" y2="3"/>
      <line x1="-3" y1="3" x2="3" y2="-3"/>
    </g>
    
    <!-- Zeros (o) -->
    <circle cx="8" cy="0" r="2" fill="none" stroke="#1abc9c" stroke-width="2"/>
    
    <text x="0" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#bdc3c7">POLE-ZERO</text>
  </g>
  
  <!-- Ripple indicator -->
  <g transform="translate(75, 45)">
    <path d="M 0,0 L 3,-2 L 6,0 L 9,-2 L 12,0" stroke="#f39c12" stroke-width="1" fill="none"/>
    <text x="6" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#f39c12">δ</text>
  </g>
  
  <!-- Performance metrics -->
  <g transform="translate(125, 45)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">-3dB</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">CUTOFF</text>
  </g>
  
  <!-- Digital signal processing indicator -->
  <g transform="translate(100, 25)">
    <!-- Digital samples -->
    <g fill="#3498db">
      <circle cx="-20" cy="0" r="1.5"/>
      <circle cx="-10" cy="0" r="1.5"/>
      <circle cx="0" cy="0" r="1.5"/>
      <circle cx="10" cy="0" r="1.5"/>
      <circle cx="20" cy="0" r="1.5"/>
    </g>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#3498db" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#3498db" font-weight="bold">DISCRETE-TIME</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">DIGITAL FILTER</text>
  <text x="100" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">DESIGN</text>
</svg>
