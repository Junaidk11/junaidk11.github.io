<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="controllerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="signalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="feedbackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Input signal -->
  <g transform="translate(30, 100)">
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3498db" font-weight="bold">INPUT</text>
    <circle cx="0" cy="0" r="6" fill="url(#signalGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">r(t)</text>
  </g>
  
  <!-- Summing junction -->
  <g transform="translate(70, 100)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#95a5a6" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#95a5a6" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#95a5a6" stroke-width="2"/>
    <text x="-12" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6">+</text>
    <text x="-12" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6">-</text>
  </g>
  
  <!-- Controller block -->
  <g transform="translate(100, 100)">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="url(#controllerGradient)" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">PID</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">CONTROLLER</text>
  </g>
  
  <!-- Plant/System block -->
  <g transform="translate(140, 100)">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="rgba(52, 152, 219, 0.8)" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">G(s)</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">PLANT</text>
  </g>
  
  <!-- Output -->
  <g transform="translate(170, 100)">
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60" font-weight="bold">OUTPUT</text>
    <circle cx="0" cy="0" r="6" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">y(t)</text>
  </g>
  
  <!-- Feedback path -->
  <g>
    <path d="M 170,106 L 170,130 L 70,130 L 70,108" stroke="url(#feedbackGradient)" stroke-width="2" fill="none"/>
    <polygon points="67,108 70,112 73,108" fill="#f39c12"/>
    <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f39c12" font-weight="bold">FEEDBACK</text>
  </g>
  
  <!-- Signal flow arrows -->
  <g>
    <!-- Input to summing -->
    <line x1="36" y1="100" x2="62" y2="100" stroke="#95a5a6" stroke-width="2"/>
    <polygon points="62,97 62,103 66,100" fill="#95a5a6"/>
    
    <!-- Summing to controller -->
    <line x1="78" y1="100" x2="85" y2="100" stroke="#95a5a6" stroke-width="2"/>
    <polygon points="85,97 85,103 89,100" fill="#95a5a6"/>
    
    <!-- Controller to plant -->
    <line x1="115" y1="100" x2="125" y2="100" stroke="#95a5a6" stroke-width="2"/>
    <polygon points="125,97 125,103 129,100" fill="#95a5a6"/>
    
    <!-- Plant to output -->
    <line x1="155" y1="100" x2="164" y2="100" stroke="#95a5a6" stroke-width="2"/>
    <polygon points="164,97 164,103 168,100" fill="#95a5a6"/>
  </g>
  
  <!-- Bode plot representation -->
  <g transform="translate(100, 50)">
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9b59b6" font-weight="bold">BODE ANALYSIS</text>
    <rect x="-30" y="-5" width="60" height="15" rx="2" fill="rgba(155, 89, 182, 0.2)" stroke="#9b59b6" stroke-width="1"/>
    
    <!-- Magnitude plot -->
    <path d="M -25,0 Q -15,-3 0,0 Q 15,3 25,0" stroke="#9b59b6" stroke-width="2" fill="none"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#9b59b6">Magnitude &amp; Phase</text>
  </g>
  
  <!-- Lead-Lag notation -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e67e22" font-weight="bold">LEAD-LAG</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#e67e22">COMPENSATOR</text>
  </g>
  
  <!-- Transfer function -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f" font-weight="bold">K(s+z)</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f">------ </text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f">(s+p)</text>
  </g>
  
  <!-- Stability indicator -->
  <g transform="translate(150, 50)">
    <circle cx="0" cy="0" r="8" fill="rgba(39, 174, 96, 0.3)" stroke="#27ae60" stroke-width="2"/>
    <path d="M -4,0 L -1,3 L 4,-2" stroke="#27ae60" stroke-width="2" fill="none"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">STABLE</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">CONTROLLER</text>
  <text x="100" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">DESIGN</text>
</svg>
