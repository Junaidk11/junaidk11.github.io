<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="filterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="signalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="predictionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="virusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- COVID-19 virus representation (top-left) -->
  <g transform="translate(65, 65)">
    <!-- Virus core -->
    <circle cx="0" cy="0" r="12" fill="url(#virusGradient)" stroke="#d35400" stroke-width="1"/>
    
    <!-- Spike proteins -->
    <g stroke="url(#virusGradient)" stroke-width="2" fill="url(#virusGradient)">
      <circle cx="8" cy="0" r="2"/>
      <circle cx="-8" cy="0" r="2"/>
      <circle cx="0" cy="8" r="2"/>
      <circle cx="0" cy="-8" r="2"/>
      <circle cx="6" cy="6" r="1.5"/>
      <circle cx="-6" cy="-6" r="1.5"/>
      <circle cx="6" cy="-6" r="1.5"/>
      <circle cx="-6" cy="6" r="1.5"/>
    </g>
    
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e67e22" font-weight="bold">COVID-19</text>
  </g>
  
  <!-- Raw/Noisy Signal (top part) -->
  <g transform="translate(100, 80)" stroke="url(#signalGradient)" stroke-width="2" fill="none">
    <!-- Noisy data points -->
    <path d="M -35,10 L -30,15 L -25,5 L -20,12 L -15,8 L -10,18 L -5,3 L 0,14 L 5,9 L 10,20 L 15,6 L 20,16 L 25,11 L 30,22 L 35,7"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c" font-weight="bold">NOISY DATA</text>
    
    <!-- Measurement points -->
    <g fill="url(#signalGradient)">
      <circle cx="-30" cy="15" r="2"/>
      <circle cx="-20" cy="12" r="2"/>
      <circle cx="-10" cy="18" r="2"/>
      <circle cx="0" cy="14" r="2"/>
      <circle cx="10" cy="20" r="2"/>
      <circle cx="20" cy="16" r="2"/>
      <circle cx="30" cy="22" r="2"/>
    </g>
  </g>
  
  <!-- Kalman Filter Box (center) -->
  <g transform="translate(100, 120)">
    <!-- Filter box -->
    <rect x="-25" y="-12" width="50" height="24" rx="4" fill="url(#filterGradient)" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Filter components -->
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">KALMAN</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">FILTER</text>
    
    <!-- Input/Output arrows -->
    <polygon points="-35,0 -28,-3 -28,3" fill="#95a5a6"/>
    <polygon points="28,0 35,-3 35,3" fill="#95a5a6"/>
    
    <!-- Mathematical symbols -->
    <g transform="translate(-15, -8)" fill="white" font-family="Arial, sans-serif" font-size="6">
      <text x="0" y="0">K</text>
    </g>
    <g transform="translate(10, -8)" fill="white" font-family="Arial, sans-serif" font-size="6">
      <text x="0" y="0">P</text>
    </g>
  </g>
  
  <!-- Filtered/Predicted Signal (bottom part) -->
  <g transform="translate(100, 155)" stroke="url(#predictionGradient)" stroke-width="3" fill="none">
    <!-- Smooth filtered line -->
    <path d="M -35,5 Q -15,8 0,10 Q 15,12 35,15"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1abc9c" font-weight="bold">FILTERED OUTPUT</text>
    
    <!-- Confidence intervals (dashed lines) -->
    <path d="M -35,2 Q -15,5 0,7 Q 15,9 35,12" stroke="#1abc9c" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
    <path d="M -35,8 Q -15,11 0,13 Q 15,15 35,18" stroke="#1abc9c" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  </g>
  
  <!-- State equations (left side) -->
  <g transform="translate(45, 120)">
    <rect x="-15" y="-8" width="30" height="16" rx="2" fill="rgba(52, 73, 94, 0.8)" stroke="#7f8c8d" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">x(k+1)</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1">=Fx(k)</text>
  </g>
  
  <!-- Measurement equation (right side) -->
  <g transform="translate(155, 120)">
    <rect x="-15" y="-8" width="30" height="16" rx="2" fill="rgba(52, 73, 94, 0.8)" stroke="#7f8c8d" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">y(k)</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1">=Hx(k)</text>
  </g>
  
  <!-- Statistics/Charts (bottom-right) -->
  <g transform="translate(150, 150)">
    <!-- Mini chart bars -->
    <rect x="0" y="10" width="3" height="8" fill="#f39c12"/>
    <rect x="5" y="5" width="3" height="13" fill="#f39c12"/>
    <rect x="10" y="8" width="3" height="10" fill="#f39c12"/>
    <rect x="15" y="3" width="3" height="15" fill="#f39c12"/>
    <rect x="20" y="7" width="3" height="11" fill="#f39c12"/>
    
    <text x="11" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f39c12" font-weight="bold">STATS</text>
  </g>
  
  <!-- MATLAB logo representation (top-right) -->
  <g transform="translate(135, 65)">
    <!-- MATLAB mountain peaks -->
    <path d="M -8,8 L -4,-2 L 0,8 L 4,-2 L 8,8" stroke="#e67e22" stroke-width="2" fill="none"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e67e22" font-weight="bold">MATLAB</text>
  </g>
  
  <!-- Data flow arrows -->
  <g stroke="#95a5a6" stroke-width="1" fill="#95a5a6">
    <!-- From virus to noisy signal -->
    <line x1="75" y1="70" x2="85" y2="75"/>
    <polygon points="85,75 82,73 82,77"/>
    
    <!-- From filtered to prediction -->
    <line x1="125" y1="132" x2="125" y2="142"/>
    <polygon points="125,142 123,139 127,139"/>
  </g>
  
  <!-- Noise indicators -->
  <g transform="translate(120, 95)" fill="#e74c3c" opacity="0.6">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="8">±σ</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">KALMAN FILTER</text>
  <text x="100" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">COVID-19 ESTIMATION</text>
</svg>
