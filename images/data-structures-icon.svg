<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Binary Tree Structure (top-left) -->
  <g transform="translate(60, 50)">
    <!-- Root node -->
    <circle cx="0" cy="0" r="8" fill="url(#treeGradient)" stroke="#c0392b" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">A</text>
    
    <!-- Left and right children -->
    <line x1="0" y1="8" x2="-15" y2="25" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="0" y1="8" x2="15" y2="25" stroke="#ecf0f1" stroke-width="2"/>
    
    <circle cx="-15" cy="25" r="6" fill="url(#treeGradient)" stroke="#c0392b" stroke-width="1"/>
    <text x="-15" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">B</text>
    
    <circle cx="15" cy="25" r="6" fill="url(#treeGradient)" stroke="#c0392b" stroke-width="1"/>
    <text x="15" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">C</text>
  </g>
  
  <!-- Array Structure (top-right) -->
  <g transform="translate(120, 45)">
    <rect x="0" y="0" width="15" height="15" fill="url(#arrayGradient)" stroke="#16a085" stroke-width="1"/>
    <text x="7.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">1</text>
    
    <rect x="15" y="0" width="15" height="15" fill="url(#arrayGradient)" stroke="#16a085" stroke-width="1"/>
    <text x="22.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">2</text>
    
    <rect x="30" y="0" width="15" height="15" fill="url(#arrayGradient)" stroke="#16a085" stroke-width="1"/>
    <text x="37.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">3</text>
    
    <text x="22.5" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#bdc3c7" font-weight="bold">ARRAY</text>
  </g>
  
  <!-- Linked List (center) -->
  <g transform="translate(50, 100)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="25" height="15" rx="3" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="1"/>
    <text x="12.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">10</text>
    
    <!-- Arrow -->
    <line x1="25" y1="7.5" x2="35" y2="7.5" stroke="#ecf0f1" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Node 2 -->
    <rect x="35" y="0" width="25" height="15" rx="3" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="1"/>
    <text x="47.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">20</text>
    
    <!-- Arrow -->
    <line x1="60" y1="7.5" x2="70" y2="7.5" stroke="#ecf0f1" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Node 3 -->
    <rect x="70" y="0" width="25" height="15" rx="3" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="1"/>
    <text x="82.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">30</text>
    
    <text x="47.5" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#bdc3c7" font-weight="bold">LINKED LIST</text>
  </g>
  
  <!-- Stack (bottom-left) -->
  <g transform="translate(45, 130)">
    <rect x="0" y="20" width="20" height="8" fill="url(#arrayGradient)" stroke="#16a085" stroke-width="1"/>
    <text x="10" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">C</text>
    
    <rect x="0" y="12" width="20" height="8" fill="url(#arrayGradient)" stroke="#16a085" stroke-width="1"/>
    <text x="10" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">B</text>
    
    <rect x="0" y="4" width="20" height="8" fill="url(#arrayGradient)" stroke="#16a085" stroke-width="1"/>
    <text x="10" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">A</text>
    
    <text x="10" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#bdc3c7" font-weight="bold">STACK</text>
    
    <!-- Arrow pointing to top -->
    <polygon points="25,8 30,6 30,10" fill="#f39c12"/>
  </g>
  
  <!-- Queue (bottom-right) -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="12" height="12" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="1"/>
    <text x="6" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">1</text>
    
    <rect x="15" y="0" width="12" height="12" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="1"/>
    <text x="21" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">2</text>
    
    <rect x="30" y="0" width="12" height="12" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="1"/>
    <text x="36" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">3</text>
    
    <text x="21" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#bdc3c7" font-weight="bold">QUEUE</text>
    
    <!-- Arrows -->
    <polygon points="-5,6 0,4 0,8" fill="#f39c12"/>
    <polygon points="47,6 52,4 52,8" fill="#f39c12"/>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ecf0f1"/>
    </marker>
  </defs>
  
  <!-- Main title -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ecf0f1" font-weight="bold">DATA STRUCTURES</text>
  <text x="100" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bdc3c7">&amp; ALGORITHMS</text>
</svg>
