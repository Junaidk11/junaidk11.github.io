<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="couplerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="followerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Four-bar mechanism -->
  <g transform="translate(100, 100)">
    <!-- Frame (ground link) -->
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#95a5a6" stroke-width="6"/>
    <!-- Ground symbols -->
    <g stroke="#95a5a6" stroke-width="2">
      <line x1="-45" y1="25" x2="-35" y2="25"/>
      <line x1="-42" y1="28" x2="-38" y2="28"/>
      <line x1="-40" y1="31" x2="-40" y2="31"/>
      
      <line x1="35" y1="25" x2="45" y2="25"/>
      <line x1="38" y1="28" x2="42" y2="28"/>
      <line x1="40" y1="31" x2="40" y2="31"/>
    </g>
    
    <!-- Input link (crank) -->
    <line x1="-40" y1="20" x2="-15" y2="-10" stroke="url(#inputGradient)" stroke-width="4"/>
    
    <!-- Coupler link -->
    <line x1="-15" y1="-10" x2="25" y2="-5" stroke="url(#couplerGradient)" stroke-width="4"/>
    
    <!-- Follower link (rocker) -->
    <line x1="25" y1="-5" x2="40" y2="20" stroke="url(#followerGradient)" stroke-width="4"/>
    
    <!-- Joints -->
    <circle cx="-40" cy="20" r="4" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <circle cx="-15" cy="-10" r="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <circle cx="25" cy="-5" r="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <circle cx="40" cy="20" r="4" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- Joint labels -->
    <text x="-45" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6" font-weight="bold">A</text>
    <text x="-20" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">B</text>
    <text x="30" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">C</text>
    <text x="45" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6" font-weight="bold">D</text>
  </g>
  
  <!-- Motion arrow on input link -->
  <g transform="translate(75, 90)">
    <path d="M 0,0 A 8,8 0 0,1 12,8" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <polygon points="12,8 14,5 10,6" fill="#e74c3c"/>
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">ω₁</text>
  </g>
  
  <!-- Precision points -->
  <g>
    <circle cx="80" cy="70" r="2" fill="#f1c40f"/>
    <circle cx="90" cy="65" r="2" fill="#f1c40f"/>
    <circle cx="110" cy="75" r="2" fill="#f1c40f"/>
    <circle cx="120" cy="85" r="2" fill="#f1c40f"/>
    <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f" font-weight="bold">PRECISION POINTS</text>
  </g>
  
  <!-- Function generation representation -->
  <g transform="translate(100, 40)">
    <rect x="-25" y="-8" width="50" height="16" rx="2" fill="rgba(241, 196, 15, 0.8)" stroke="#f1c40f" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">FUNCTION</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">GENERATION</text>
  </g>
  
  <!-- Link labels and descriptions -->
  <g>
    <!-- Input link label -->
    <g transform="translate(50, 80)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#e74c3c" font-weight="bold">INPUT</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">LINK</text>
    </g>
    
    <!-- Coupler link label -->
    <g transform="translate(100, 75)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f39c12" font-weight="bold">COUPLER</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#f39c12">LINK</text>
    </g>
    
    <!-- Follower link label -->
    <g transform="translate(150, 80)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#27ae60" font-weight="bold">FOLLOWER</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">LINK</text>
    </g>
    
    <!-- Ground link label -->
    <g transform="translate(100, 140)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6" font-weight="bold">FRAME</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#95a5a6">(GROUND)</text>
    </g>
  </g>
  
  <!-- Kinematic synthesis representation -->
  <g transform="translate(40, 130)">
    <circle cx="0" cy="0" r="8" fill="rgba(155, 89, 182, 0.3)" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#9b59b6" font-weight="bold">KIN</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#9b59b6">SYN</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#9b59b6">SYNTHESIS</text>
  </g>
  
  <!-- Ergonomic application -->
  <g transform="translate(160, 130)">
    <circle cx="0" cy="0" r="8" fill="rgba(39, 174, 96, 0.3)" stroke="#27ae60" stroke-width="2"/>
    <path d="M -4,-2 Q 0,-6 4,-2 Q 0,2 -4,-2" fill="#27ae60"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">ERGONOMIC</text>
  </g>
  
  <!-- Gardening tool representation -->
  <g transform="translate(130, 95)">
    <!-- Tool handle -->
    <line x1="0" y1="0" x2="15" y2="-10" stroke="#8e44ad" stroke-width="3"/>
    <!-- Tool head -->
    <ellipse cx="17" cy="-12" rx="4" ry="2" fill="#95a5a6"/>
    <text x="20" y="5" text-anchor="start" font-family="Arial, sans-serif" font-size="5" fill="#8e44ad">GARDEN TOOL</text>
  </g>
  
  <!-- Degrees of freedom -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">DOF = 1</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#bdc3c7">Single Input</text>
  </g>
  
  <!-- Motion trajectory -->
  <g transform="translate(125, 85)" opacity="0.6">
    <path d="M 0,0 Q 5,-8 10,-5 Q 15,-2 20,-8" stroke="#f1c40f" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
    <text x="10" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#f1c40f">PATH</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">FOUR-BAR</text>
  <text x="100" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">MECHANISM</text>
</svg>
