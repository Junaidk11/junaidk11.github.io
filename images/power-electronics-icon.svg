<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="acGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pwmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="motorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- AC Input (left side) -->
  <g transform="translate(40, 80)">
    <!-- AC Waveform -->
    <path d="M -10,0 Q -5,-8 0,0 Q 5,8 10,0" stroke="url(#acGradient)" stroke-width="3" fill="none"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c" font-weight="bold">AC INPUT</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#e74c3c">120V/240V</text>
  </g>
  
  <!-- Power Electronics Circuit (center) -->
  <g transform="translate(100, 100)">
    <!-- Main converter box -->
    <rect x="-25" y="-20" width="50" height="40" rx="4" fill="rgba(52, 73, 94, 0.9)" stroke="#3498db" stroke-width="2"/>
    
    <!-- Circuit elements -->
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3498db" font-weight="bold">POWER</text>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3498db" font-weight="bold">ELECTRONICS</text>
    
    <!-- MOSFET/IGBT symbols -->
    <g transform="translate(-15, 8)">
      <rect x="-3" y="-3" width="6" height="6" fill="url(#switchGradient)" stroke="#16a085" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white" font-weight="bold">Q</text>
    </g>
    <g transform="translate(0, 8)">
      <rect x="-3" y="-3" width="6" height="6" fill="url(#switchGradient)" stroke="#16a085" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white" font-weight="bold">Q</text>
    </g>
    <g transform="translate(15, 8)">
      <rect x="-3" y="-3" width="6" height="6" fill="url(#switchGradient)" stroke="#16a085" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white" font-weight="bold">Q</text>
    </g>
    
    <!-- Input/Output connections -->
    <polygon points="-35,0 -28,-3 -28,3" fill="#95a5a6"/>
    <polygon points="28,0 35,-3 35,3" fill="#95a5a6"/>
  </g>
  
  <!-- DC Output (right side) -->
  <g transform="translate(160, 80)">
    <!-- DC Level -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="url(#dcGradient)" stroke-width="3"/>
    <line x1="-10" y1="3" x2="10" y2="3" stroke="url(#dcGradient)" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3498db" font-weight="bold">DC OUTPUT</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#3498db">Variable V</text>
  </g>
  
  <!-- PWM Control (top) -->
  <g transform="translate(100, 50)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="rgba(52, 73, 94, 0.8)" stroke="#f39c12" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#f39c12" font-weight="bold">PWM CONTROL</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#f39c12">Duty Cycle</text>
    
    <!-- PWM signal -->
    <g transform="translate(0, 15)" stroke="#f39c12" stroke-width="1" fill="none">
      <path d="M -15,0 L -12,0 L -12,-4 L -9,-4 L -9,0 L -6,0 L -6,-4 L -3,-4 L -3,0 L 0,0 L 0,-4 L 3,-4 L 3,0 L 6,0 L 6,-4 L 9,-4 L 9,0 L 12,0 L 12,-4 L 15,-4"/>
    </g>
  </g>
  
  <!-- H-Bridge Motor Drive (bottom-right) -->
  <g transform="translate(140, 140)">
    <circle cx="0" cy="0" r="12" fill="url(#motorGradient)" stroke="#8e44ad" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">M</text>
    <text x="0" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#9b59b6" font-weight="bold">MOTOR</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#9b59b6">H-BRIDGE</text>
    
    <!-- H-bridge switches -->
    <rect x="-8" y="-8" width="4" height="4" fill="#1abc9c"/>
    <rect x="4" y="-8" width="4" height="4" fill="#1abc9c"/>
    <rect x="-8" y="4" width="4" height="4" fill="#1abc9c"/>
    <rect x="4" y="4" width="4" height="4" fill="#1abc9c"/>
  </g>
  
  <!-- Buck Converter Circuit (bottom-left) -->
  <g transform="translate(60, 140)">
    <!-- Inductor -->
    <g stroke="#16a085" stroke-width="2" fill="none">
      <path d="M -10,0 Q -8,-3 -6,0 Q -4,3 -2,0 Q 0,-3 2,0 Q 4,3 6,0 Q 8,-3 10,0"/>
    </g>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#1abc9c" font-weight="bold">L</text>
    
    <!-- Capacitor -->
    <g transform="translate(0, 8)" stroke="#1abc9c" stroke-width="2">
      <line x1="-4" y1="0" x2="-2" y2="0"/>
      <line x1="2" y1="0" x2="4" y2="0"/>
      <line x1="-2" y1="-3" x2="-2" y2="3"/>
      <line x1="2" y1="-3" x2="2" y2="3"/>
    </g>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#1abc9c">C</text>
    
    <text x="0" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1abc9c" font-weight="bold">BUCK CONV.</text>
  </g>
  
  <!-- Power Factor Correction (top-left) -->
  <g transform="translate(60, 50)">
    <rect x="-15" y="-6" width="30" height="12" rx="2" fill="rgba(52, 73, 94, 0.8)" stroke="#e67e22" stroke-width="1"/>
    <text x="0" y="-1" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#e67e22" font-weight="bold">PFC</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e67e22">cosφ = 0.95</text>
  </g>
  
  <!-- Efficiency Indicator -->
  <g transform="translate(140, 50)">
    <circle cx="0" cy="0" r="10" fill="rgba(52, 73, 94, 0.8)" stroke="#27ae60" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#27ae60" font-weight="bold">85%</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#27ae60">EFF</text>
  </g>
  
  <!-- Heat Sink Representation -->
  <g transform="translate(100, 130)">
    <g stroke="#95a5a6" stroke-width="1" fill="#95a5a6">
      <rect x="-8" y="0" width="16" height="4"/>
      <rect x="-6" y="4" width="2" height="6"/>
      <rect x="-2" y="4" width="2" height="6"/>
      <rect x="2" y="4" width="2" height="6"/>
      <rect x="6" y="4" width="2" height="6"/>
    </g>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#95a5a6">THERMAL</text>
  </g>
  
  <!-- Control Feedback -->
  <g transform="translate(70, 100)" stroke="#f39c12" stroke-width="1" fill="none">
    <path d="M 0,20 Q -10,25 -20,20 Q -25,10 -20,0 Q -10,-5 0,0" stroke-dasharray="3,2"/>
    <polygon points="-20,0 -23,-2 -23,2" fill="#f39c12"/>
    <text x="-15" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#f39c12">FEEDBACK</text>
  </g>
  
  <!-- Power rating -->
  <g transform="translate(100, 25)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ecf0f1" font-weight="bold">HIGH POWER</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#bdc3c7">SWITCHING</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">POWER</text>
  <text x="100" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">ELECTRONICS</text>
</svg>
