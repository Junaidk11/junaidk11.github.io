<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="solarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="batteryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="simulationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gymGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Sun -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="12" fill="url(#solarGradient)" stroke="#e67e22" stroke-width="2"/>
    <!-- Sun rays -->
    <g stroke="#f1c40f" stroke-width="2">
      <line x1="0" y1="-18" x2="0" y2="-22"/>
      <line x1="13" y1="-13" x2="15" y2="-15"/>
      <line x1="18" y1="0" x2="22" y2="0"/>
      <line x1="13" y1="13" x2="15" y2="15"/>
      <line x1="0" y1="18" x2="0" y2="22"/>
      <line x1="-13" y1="13" x2="-15" y2="15"/>
      <line x1="-18" y1="0" x2="-22" y2="0"/>
      <line x1="-13" y1="-13" x2="-15" y2="-15"/>
    </g>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f39c12" font-weight="bold">SOLAR</text>
  </g>
  
  <!-- Solar panels -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="20" height="12" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
    <g stroke="#3498db" stroke-width="0.5">
      <line x1="5" y1="0" x2="5" y2="12"/>
      <line x1="10" y1="0" x2="10" y2="12"/>
      <line x1="15" y1="0" x2="15" y2="12"/>
      <line x1="0" y1="4" x2="20" y2="4"/>
      <line x1="0" y1="8" x2="20" y2="8"/>
    </g>
  </g>
  
  <!-- Gym equipment (energy generation) -->
  <g transform="translate(150, 70)">
    <rect x="-15" y="-8" width="30" height="16" rx="2" fill="url(#gymGradient)" stroke="#8e44ad" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">GYM</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">ENERGY</text>
    
    <!-- Exercise bike representation -->
    <g transform="translate(0, 20)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#9b59b6" stroke-width="2"/>
      <line x1="-8" y1="-4" x2="8" y2="4" stroke="#9b59b6" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Energy storage (battery) -->
  <g transform="translate(100, 100)">
    <rect x="-20" y="-10" width="40" height="20" rx="3" fill="url(#batteryGradient)" stroke="#c0392b" stroke-width="2"/>
    <rect x="20" y="-6" width="4" height="12" fill="#c0392b"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">STORAGE</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">BATTERY</text>
    
    <!-- Battery level indicator -->
    <rect x="-15" y="-5" width="30" height="10" fill="none" stroke="white" stroke-width="1"/>
    <rect x="-14" y="-4" width="20" height="8" fill="#27ae60"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1">75%</text>
  </g>
  
  <!-- Energy consumption (washing machine) -->
  <g transform="translate(60, 130)">
    <rect x="-12" y="-8" width="24" height="16" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#3498db" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#3498db"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">WASHING</text>
  </g>
  
  <!-- Energy consumption (dryer) -->
  <g transform="translate(140, 130)">
    <rect x="-12" y="-8" width="24" height="16" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <path d="M -3,-3 Q 0,0 3,-3 Q 0,3 -3,-3" fill="#e74c3c"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">DRYER</text>
  </g>
  
  <!-- Energy flow arrows -->
  <g stroke="#f1c40f" stroke-width="2" fill="#f1c40f">
    <!-- From solar to storage -->
    <line x1="90" y1="76" x2="85" y2="95"/>
    <polygon points="83,93 87,97 89,93"/>
    
    <!-- From gym to storage -->
    <line x1="135" y1="78" x2="115" y2="95"/>
    <polygon points="113,93 117,97 119,93"/>
    
    <!-- From storage to appliances -->
    <line x1="85" y1="115" x2="72" y2="122"/>
    <polygon points="70,120 74,124 76,120"/>
    
    <line x1="115" y1="115" x2="128" y2="122"/>
    <polygon points="126,120 130,124 132,120"/>
  </g>
  
  <!-- MATLAB/Simulink simulation -->
  <g transform="translate(100, 40)">
    <rect x="-25" y="-8" width="50" height="16" rx="3" fill="url(#simulationGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">MATLAB SIMULATION</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">SYSTEM MODELING</text>
  </g>
  
  <!-- System efficiency -->
  <g transform="translate(30, 130)">
    <circle cx="0" cy="0" r="10" fill="rgba(39, 174, 96, 0.3)" stroke="#27ae60" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#27ae60" font-weight="bold">85%</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#27ae60">EFF</text>
  </g>
  
  <!-- Cost savings -->
  <g transform="translate(170, 130)">
    <circle cx="0" cy="0" r="10" fill="rgba(241, 196, 15, 0.3)" stroke="#f1c40f" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f" font-weight="bold">$50</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#f1c40f">SAVE</text>
  </g>
  
  <!-- Renewable energy icon -->
  <g transform="translate(40, 100)">
    <path d="M 0,-8 Q -8,0 0,8 Q 8,0 0,-8" fill="#27ae60" opacity="0.7"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">ECO</text>
  </g>
  
  <!-- Smart grid connection -->
  <g transform="translate(160, 100)">
    <rect x="-8" y="-4" width="16" height="8" fill="none" stroke="#3498db" stroke-width="1"/>
    <circle cx="-6" cy="0" r="1" fill="#3498db"/>
    <circle cx="0" cy="0" r="1" fill="#3498db"/>
    <circle cx="6" cy="0" r="1" fill="#3498db"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#3498db">GRID</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">RENEWABLE</text>
  <text x="100" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">ENERGY SYSTEM</text>
</svg>
