<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labviewGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="automationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sensorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="actuatorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- LabVIEW Interface -->
  <g transform="translate(100, 40)">
    <rect x="-35" y="-15" width="70" height="30" rx="3" fill="url(#labviewGradient)" stroke="#e67e22" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">LabVIEW</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">VIRTUAL INSTRUMENT</text>
    
    <!-- LabVIEW blocks representation -->
    <rect x="-25" y="-10" width="15" height="8" fill="rgba(255,255,255,0.3)" rx="1"/>
    <rect x="-8" y="-10" width="15" height="8" fill="rgba(255,255,255,0.3)" rx="1"/>
    <rect x="10" y="-10" width="15" height="8" fill="rgba(255,255,255,0.3)" rx="1"/>
  </g>
  
  <!-- Assembly line conveyor -->
  <g transform="translate(100, 100)">
    <rect x="-60" y="-5" width="120" height="10" fill="#7f8c8d" stroke="#95a5a6" stroke-width="1"/>
    <!-- Conveyor rollers -->
    <g fill="#95a5a6">
      <circle cx="-45" cy="0" r="3"/>
      <circle cx="-30" cy="0" r="3"/>
      <circle cx="-15" cy="0" r="3"/>
      <circle cx="0" cy="0" r="3"/>
      <circle cx="15" cy="0" r="3"/>
      <circle cx="30" cy="0" r="3"/>
      <circle cx="45" cy="0" r="3"/>
    </g>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1">ASSEMBLY LINE</text>
  </g>
  
  <!-- Component sorting station -->
  <g transform="translate(50, 80)">
    <rect x="-12" y="-8" width="24" height="16" fill="url(#automationGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">SORT</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">STATION</text>
    
    <!-- Components being sorted -->
    <circle cx="-8" cy="-20" r="3" fill="#e74c3c"/>
    <rect x="-3" y="-23" width="6" height="6" fill="#f39c12"/>
    <polygon points="8,-20 11,-14 5,-14" fill="#27ae60"/>
  </g>
  
  <!-- Assembly inspection station -->
  <g transform="translate(150, 80)">
    <rect x="-12" y="-8" width="24" height="16" fill="url(#automationGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">INSPECT</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">STATION</text>
    
    <!-- Inspection camera/sensor -->
    <rect x="-4" y="-25" width="8" height="6" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="0" cy="-22" r="2" fill="#e74c3c"/>
  </g>
  
  <!-- Sensors -->
  <g>
    <!-- Proximity sensor -->
    <g transform="translate(30, 120)">
      <rect x="-6" y="-4" width="12" height="8" fill="url(#sensorGradient)" stroke="#c0392b" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="white"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">SENSOR</text>
    </g>
    
    <!-- Vision sensor -->
    <g transform="translate(70, 120)">
      <rect x="-6" y="-4" width="12" height="8" fill="url(#sensorGradient)" stroke="#c0392b" stroke-width="1"/>
      <rect x="-3" y="-2" width="6" height="4" fill="white"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">VISION</text>
    </g>
    
    <!-- Pressure sensor -->
    <g transform="translate(130, 120)">
      <rect x="-6" y="-4" width="12" height="8" fill="url(#sensorGradient)" stroke="#c0392b" stroke-width="1"/>
      <polygon points="0,-2 3,2 -3,2" fill="white"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">PRESS</text>
    </g>
    
    <!-- Temperature sensor -->
    <g transform="translate(170, 120)">
      <rect x="-6" y="-4" width="12" height="8" fill="url(#sensorGradient)" stroke="#c0392b" stroke-width="1"/>
      <circle cx="0" cy="-1" r="1" fill="white"/>
      <rect x="-1" y="0" width="2" height="3" fill="white"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">TEMP</text>
    </g>
  </g>
  
  <!-- Actuators -->
  <g>
    <!-- Pneumatic actuator -->
    <g transform="translate(50, 140)">
      <rect x="-8" y="-4" width="16" height="8" fill="url(#actuatorGradient)" stroke="#229954" stroke-width="1"/>
      <circle cx="-6" cy="0" r="2" fill="white"/>
      <rect x="-2" y="-2" width="8" height="4" fill="white"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">PNEUMATIC</text>
    </g>
    
    <!-- Motor actuator -->
    <g transform="translate(120, 140)">
      <circle cx="0" cy="0" r="6" fill="url(#actuatorGradient)" stroke="#229954" stroke-width="1"/>
      <rect x="-2" y="-2" width="4" height="4" fill="white"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">MOTOR</text>
    </g>
  </g>
  
  <!-- Control connections -->
  <g stroke="#f1c40f" stroke-width="2" fill="none">
    <!-- From LabVIEW to stations -->
    <path d="M 75,55 Q 60,70 50,88"/>
    <path d="M 125,55 Q 140,70 150,88"/>
    
    <!-- From sensors to LabVIEW -->
    <path d="M 30,112 Q 50,80 75,55"/>
    <path d="M 70,112 Q 80,80 90,55"/>
    <path d="M 130,112 Q 120,80 110,55"/>
    <path d="M 170,112 Q 150,80 125,55"/>
    
    <!-- To actuators -->
    <path d="M 85,55 Q 70,90 50,132"/>
    <path d="M 115,55 Q 120,90 120,132"/>
  </g>
  
  <!-- Widget assembly -->
  <g transform="translate(100, 75)">
    <g fill="#95a5a6">
      <rect x="-8" y="-3" width="6" height="6"/>
      <circle cx="0" cy="0" r="2"/>
      <polygon points="5,-3 8,3 2,3"/>
    </g>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">WIDGET</text>
  </g>
  
  <!-- Accept/Reject indicator -->
  <g transform="translate(40, 160)">
    <circle cx="0" cy="0" r="8" fill="#27ae60"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">✓</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">ACCEPT</text>
  </g>
  
  <g transform="translate(160, 160)">
    <circle cx="0" cy="0" r="8" fill="#e74c3c"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">✗</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">REJECT</text>
  </g>
  
  <!-- Front panel interface -->
  <g transform="translate(100, 160)">
    <rect x="-20" y="-8" width="40" height="16" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="-10" cy="0" r="3" fill="#27ae60"/>
    <circle cx="0" cy="0" r="3" fill="#e74c3c"/>
    <rect x="5" y="-3" width="10" height="6" fill="#3498db"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">FRONT PANEL</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">INDUSTRIAL</text>
  <text x="100" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">AUTOMATION</text>
</svg>
