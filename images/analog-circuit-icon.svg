<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="resistorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capacitorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inductorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opampGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Circuit board background -->
  <rect x="20" y="20" width="160" height="120" fill="#2c5530" stroke="#27ae60" stroke-width="1" opacity="0.3"/>
  
  <!-- Op-Amp (Operational Amplifier) -->
  <g transform="translate(100, 60)">
    <polygon points="-15,0 15,-10 15,10" fill="url(#opampGradient)" stroke="#e67e22" stroke-width="2"/>
    <text x="-8" y="-5" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">-</text>
    <text x="-8" y="8" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">+</text>
    <text x="5" y="3" font-family="Arial, sans-serif" font-size="5" fill="white" font-weight="bold">741</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f39c12" font-weight="bold">OP-AMP</text>
  </g>
  
  <!-- Resistors -->
  <g>
    <!-- R1 - Input resistor -->
    <g transform="translate(50, 55)">
      <rect x="-8" y="-3" width="16" height="6" fill="url(#resistorGradient)" stroke="#c0392b" stroke-width="1"/>
      <line x1="-12" y1="0" x2="-8" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <line x1="8" y1="0" x2="12" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">R₁</text>
    </g>
    
    <!-- R2 - Feedback resistor -->
    <g transform="translate(100, 35)">
      <rect x="-8" y="-3" width="16" height="6" fill="url(#resistorGradient)" stroke="#c0392b" stroke-width="1"/>
      <line x1="-12" y1="0" x2="-8" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <line x1="8" y1="0" x2="12" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">R₂</text>
    </g>
    
    <!-- R3 - Load resistor -->
    <g transform="translate(150, 60)">
      <rect x="-8" y="-3" width="16" height="6" fill="url(#resistorGradient)" stroke="#c0392b" stroke-width="1"/>
      <line x1="-12" y1="0" x2="-8" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <line x1="8" y1="0" x2="12" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">R₃</text>
    </g>
  </g>
  
  <!-- Capacitors -->
  <g>
    <!-- C1 - Input coupling -->
    <g transform="translate(65, 100)">
      <line x1="-6" y1="-8" x2="-6" y2="8" stroke="url(#capacitorGradient)" stroke-width="3"/>
      <line x1="6" y1="-8" x2="6" y2="8" stroke="url(#capacitorGradient)" stroke-width="3"/>
      <line x1="-10" y1="0" x2="-6" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <line x1="6" y1="0" x2="10" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#3498db">C₁</text>
    </g>
    
    <!-- C2 - Output coupling -->
    <g transform="translate(135, 100)">
      <line x1="-6" y1="-8" x2="-6" y2="8" stroke="url(#capacitorGradient)" stroke-width="3"/>
      <line x1="6" y1="-8" x2="6" y2="8" stroke="url(#capacitorGradient)" stroke-width="3"/>
      <line x1="-10" y1="0" x2="-6" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <line x1="6" y1="0" x2="10" y2="0" stroke="#ecf0f1" stroke-width="2"/>
      <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#3498db">C₂</text>
    </g>
  </g>
  
  <!-- Inductor -->
  <g transform="translate(100, 120)">
    <path d="M -12,0 Q -8,-6 -4,0 Q 0,6 4,0 Q 8,-6 12,0" stroke="url(#inductorGradient)" stroke-width="3" fill="none"/>
    <line x1="-16" y1="0" x2="-12" y2="0" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="12" y1="0" x2="16" y2="0" stroke="#ecf0f1" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#27ae60">L₁</text>
  </g>
  
  <!-- Power supply connections -->
  <g>
    <!-- VCC -->
    <g transform="translate(30, 30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e74c3c" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#e74c3c"/>
      <text x="5" y="3" font-family="Arial, sans-serif" font-size="6" fill="#e74c3c" font-weight="bold">+VCC</text>
    </g>
    
    <!-- VEE -->
    <g transform="translate(30, 50)">
      <line x1="0" y1="0" x2="0" y2="-8" stroke="#3498db" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#3498db"/>
      <text x="5" y="3" font-family="Arial, sans-serif" font-size="6" fill="#3498db" font-weight="bold">-VEE</text>
    </g>
    
    <!-- Ground -->
    <g transform="translate(30, 70)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#95a5a6" stroke-width="2"/>
      <line x1="-5" y1="8" x2="5" y2="8" stroke="#95a5a6" stroke-width="2"/>
      <line x1="-3" y1="10" x2="3" y2="10" stroke="#95a5a6" stroke-width="2"/>
      <line x1="-1" y1="12" x2="1" y2="12" stroke="#95a5a6" stroke-width="2"/>
      <text x="8" y="6" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6" font-weight="bold">GND</text>
    </g>
  </g>
  
  <!-- Signal paths -->
  <g stroke="#ecf0f1" stroke-width="2" fill="none">
    <!-- Input signal path -->
    <path d="M 38,55 L 85,55"/>
    <path d="M 62,55 L 62,90"/>
    <path d="M 75,100 L 85,65"/>
    
    <!-- Feedback path -->
    <path d="M 115,60 L 125,35 L 88,35 L 88,50"/>
    
    <!-- Output path -->
    <path d="M 115,60 L 125,100"/>
    <path d="M 145,100 L 170,100"/>
    
    <!-- Power connections -->
    <path d="M 30,38 L 100,45"/>
    <path d="M 30,42 L 100,75"/>
    <path d="M 30,70 L 100,70"/>
    
    <!-- Component connections -->
    <path d="M 100,105 L 100,100"/>
  </g>
  
  <!-- Input/Output labels -->
  <g>
    <!-- Input -->
    <g transform="translate(30, 55)">
      <text x="-5" y="0" text-anchor="end" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f" font-weight="bold">Vᵢₙ</text>
      <circle cx="0" cy="0" r="2" fill="#f1c40f"/>
    </g>
    
    <!-- Output -->
    <g transform="translate(170, 100)">
      <text x="5" y="0" text-anchor="start" font-family="Arial, sans-serif" font-size="6" fill="#27ae60" font-weight="bold">Vₒᵤₜ</text>
      <circle cx="0" cy="0" r="2" fill="#27ae60"/>
    </g>
  </g>
  
  <!-- Circuit analysis indicators -->
  <g>
    <!-- Gain formula -->
    <g transform="translate(50, 160)">
      <rect x="-20" y="-8" width="40" height="16" rx="2" fill="rgba(52, 73, 94, 0.8)" stroke="#34495e" stroke-width="1"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">Av = -R₂/R₁</text>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#ecf0f1">VOLTAGE GAIN</text>
    </g>
    
    <!-- Frequency response -->
    <g transform="translate(150, 160)">
      <rect x="-20" y="-8" width="40" height="16" rx="2" fill="rgba(155, 89, 182, 0.8)" stroke="#9b59b6" stroke-width="1"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">f₃ₐB</text>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">BANDWIDTH</text>
    </g>
  </g>
  
  <!-- Signal waveforms -->
  <g>
    <!-- Input sine wave -->
    <g transform="translate(40, 140)">
      <path d="M -8,0 Q -4,-4 0,0 Q 4,4 8,0" stroke="#f1c40f" stroke-width="2" fill="none"/>
      <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#f1c40f">INPUT</text>
    </g>
    
    <!-- Output sine wave (inverted and amplified) -->
    <g transform="translate(160, 140)">
      <path d="M -8,0 Q -4,6 0,0 Q 4,-6 8,0" stroke="#27ae60" stroke-width="2" fill="none"/>
      <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#27ae60">OUTPUT</text>
    </g>
  </g>
  
  <!-- Filter type indicator -->
  <g transform="translate(100, 145)">
    <circle cx="0" cy="0" r="10" fill="rgba(231, 76, 60, 0.3)" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c" font-weight="bold">HPF</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#e74c3c">FILTER</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">ANALOG</text>
  <text x="100" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">CIRCUITS</text>
</svg>
