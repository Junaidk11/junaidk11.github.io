<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="springGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="simulationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Vertical slab (frame) -->
  <rect x="30" y="20" width="140" height="140" fill="none" stroke="#95a5a6" stroke-width="3"/>
  <text x="35" y="15" font-family="Arial, sans-serif" font-size="6" fill="#95a5a6">VERTICAL SLAB</text>
  
  <!-- Ball -->
  <circle cx="45" cy="45" r="5" fill="url(#ballGradient)" stroke="#c0392b" stroke-width="2"/>
  <text x="55" y="45" font-family="Arial, sans-serif" font-size="6" fill="#e74c3c" font-weight="bold">BALL</text>
  
  <!-- Spring mechanism -->
  <g transform="translate(50, 50)">
    <path d="M 0,0 L 2,-2 L -2,-4 L 2,-6 L -2,-8 L 2,-10 L 0,-12" 
          stroke="url(#springGradient)" stroke-width="2" fill="none"/>
    <text x="8" y="-6" font-family="Arial, sans-serif" font-size="5" fill="#f39c12" font-weight="bold">SPRING</text>
  </g>
  
  <!-- Dynamic path with various components -->
  <g stroke="url(#pathGradient)" stroke-width="3" fill="none">
    <!-- Initial curved path -->
    <path d="M 45,60 Q 60,70 75,65"/>
    
    <!-- Rotating element -->
    <g transform="translate(85, 75)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#f39c12" stroke-width="2"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#f39c12" stroke-width="2"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#f39c12" stroke-width="2"/>
      <text x="12" y="0" font-family="Arial, sans-serif" font-size="5" fill="#f39c12">ROTATE</text>
    </g>
    
    <!-- Continuing path -->
    <path d="M 95,75 Q 110,80 125,75"/>
    
    <!-- Curved section -->
    <path d="M 125,75 Q 140,90 135,110"/>
    
    <!-- Impact point -->
    <g transform="translate(135, 110)">
      <circle cx="0" cy="0" r="3" fill="#e74c3c"/>
      <g stroke="#e74c3c" stroke-width="1">
        <line x1="-5" y1="-5" x2="5" y2="5"/>
        <line x1="-5" y1="5" x2="5" y2="-5"/>
      </g>
      <text x="8" y="0" font-family="Arial, sans-serif" font-size="5" fill="#e74c3c">IMPACT</text>
    </g>
    
    <!-- Final slope to target -->
    <path d="M 135,115 Q 150,125 155,145"/>
  </g>
  
  <!-- Target position -->
  <g transform="translate(155, 145)">
    <rect x="-5" y="-5" width="10" height="10" fill="rgba(39, 174, 96, 0.3)" stroke="#27ae60" stroke-width="2"/>
    <text x="8" y="0" font-family="Arial, sans-serif" font-size="6" fill="#27ae60" font-weight="bold">TARGET</text>
  </g>
  
  <!-- Time constraint -->
  <g transform="translate(100, 30)">
    <rect x="-20" y="-8" width="40" height="16" rx="2" fill="rgba(231, 76, 60, 0.8)" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">3-5 SEC</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">TRAVEL TIME</text>
  </g>
  
  <!-- MATLAB simulation -->
  <g transform="translate(50, 160)">
    <rect x="-20" y="-8" width="40" height="16" rx="2" fill="url(#simulationGradient)" stroke="#8e44ad" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">MATLAB</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">SIMULATION</text>
  </g>
  
  <!-- Design iterations -->
  <g transform="translate(150, 160)">
    <circle cx="0" cy="0" r="10" fill="rgba(241, 196, 15, 0.3)" stroke="#f1c40f" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#f1c40f" font-weight="bold">1.3</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#f1c40f">ITER</text>
  </g>
  
  <!-- Energy indicators -->
  <g>
    <!-- Kinetic energy -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="6" fill="#3498db" font-weight="bold">KE</text>
      <path d="M 0,5 Q 5,8 10,5" stroke="#3498db" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Potential energy -->
    <g transform="translate(40, 120)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="6" fill="#27ae60" font-weight="bold">PE</text>
      <rect x="0" y="5" width="8" height="3" fill="#27ae60"/>
    </g>
  </g>
  
  <!-- Motion arrows -->
  <g>
    <!-- Velocity vector -->
    <g transform="translate(70, 80)">
      <line x1="0" y1="0" x2="8" y2="4" stroke="#e74c3c" stroke-width="2"/>
      <polygon points="8,4 6,2 6,6" fill="#e74c3c"/>
      <text x="10" y="2" font-family="Arial, sans-serif" font-size="4" fill="#e74c3c">v</text>
    </g>
    
    <!-- Acceleration vector -->
    <g transform="translate(100, 95)">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#f39c12" stroke-width="2"/>
      <polygon points="6,6 4,4 4,8" fill="#f39c12"/>
      <text x="8" y="8" font-family="Arial, sans-serif" font-size="4" fill="#f39c12">a</text>
    </g>
  </g>
  
  <!-- Passive components indicator -->
  <g transform="translate(80, 130)">
    <circle cx="0" cy="0" r="8" fill="rgba(52, 152, 219, 0.3)" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#3498db" font-weight="bold">PAS</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#3498db">SYS</text>
  </g>
  
  <!-- Optimization indicator -->
  <g transform="translate(120, 130)">
    <circle cx="0" cy="0" r="8" fill="rgba(155, 89, 182, 0.3)" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#9b59b6" font-weight="bold">OPT</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#9b59b6">DESIGN</text>
  </g>
  
  <!-- Displacement analysis -->
  <g transform="translate(170, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">Δx</text>
    <path d="M 0,5 L 10,5" stroke="#ecf0f1" stroke-width="1"/>
    <path d="M 0,3 L 0,7" stroke="#ecf0f1" stroke-width="1"/>
    <path d="M 10,3 L 10,7" stroke="#ecf0f1" stroke-width="1"/>
  </g>
  
  <!-- Trajectory path visualization -->
  <g opacity="0.5">
    <path d="M 45,50 Q 60,55 75,60 Q 90,65 105,70 Q 120,75 135,85 Q 150,100 155,140" 
          stroke="#f1c40f" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
  </g>
  
  <!-- Main title -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">DYNAMIC</text>
  <text x="100" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">SYSTEM</text>
</svg>
