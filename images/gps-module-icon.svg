<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="satelliteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="signalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Earth representation -->
  <g transform="translate(100, 140)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="url(#earthGradient)" stroke="#229954" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="rgba(46, 204, 113, 0.3)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">EARTH</text>
  </g>
  
  <!-- GPS Satellites -->
  <g>
    <!-- Satellite 1 -->
    <g transform="translate(60, 40)">
      <rect x="-8" y="-4" width="16" height="8" rx="1" fill="url(#satelliteGradient)" stroke="#95a5a6" stroke-width="1"/>
      <rect x="-12" y="-2" width="4" height="4" fill="#f39c12"/>
      <rect x="8" y="-2" width="4" height="4" fill="#f39c12"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">SAT-1</text>
    </g>
    
    <!-- Satellite 2 -->
    <g transform="translate(140, 40)">
      <rect x="-8" y="-4" width="16" height="8" rx="1" fill="url(#satelliteGradient)" stroke="#95a5a6" stroke-width="1"/>
      <rect x="-12" y="-2" width="4" height="4" fill="#f39c12"/>
      <rect x="8" y="-2" width="4" height="4" fill="#f39c12"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">SAT-2</text>
    </g>
    
    <!-- Satellite 3 -->
    <g transform="translate(100, 25)">
      <rect x="-8" y="-4" width="16" height="8" rx="1" fill="url(#satelliteGradient)" stroke="#95a5a6" stroke-width="1"/>
      <rect x="-12" y="-2" width="4" height="4" fill="#f39c12"/>
      <rect x="8" y="-2" width="4" height="4" fill="#f39c12"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">SAT-3</text>
    </g>
  </g>
  
  <!-- GPS signals -->
  <g>
    <!-- Signal from Satellite 1 -->
    <g stroke="url(#signalGradient)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 60,48 Q 70,80 80,110"/>
      <circle cx="60" cy="55" r="8" stroke="#3498db" stroke-width="1" fill="none"/>
      <circle cx="60" cy="55" r="12" stroke="#3498db" stroke-width="1" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Signal from Satellite 2 -->
    <g stroke="url(#signalGradient)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 140,48 Q 130,80 120,110"/>
      <circle cx="140" cy="55" r="8" stroke="#3498db" stroke-width="1" fill="none"/>
      <circle cx="140" cy="55" r="12" stroke="#3498db" stroke-width="1" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Signal from Satellite 3 -->
    <g stroke="url(#signalGradient)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 100,35 L 100,105"/>
      <circle cx="100" cy="42" r="8" stroke="#3498db" stroke-width="1" fill="none"/>
      <circle cx="100" cy="42" r="12" stroke="#3498db" stroke-width="1" fill="none" opacity="0.5"/>
    </g>
  </g>
  
  <!-- GPS Module/Receiver -->
  <g transform="translate(100, 110)">
    <rect x="-20" y="-8" width="40" height="16" rx="2" fill="url(#moduleGradient)" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">GPS MODULE</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white">TM4C123GH6PM</text>
    
    <!-- Antenna -->
    <rect x="-2" y="-15" width="4" height="7" fill="#f39c12"/>
    <circle cx="0" cy="-18" r="3" fill="none" stroke="#f39c12" stroke-width="2"/>
  </g>
  
  <!-- NMEA Protocol representation -->
  <g transform="translate(40, 110)">
    <rect x="-15" y="-6" width="30" height="12" rx="2" fill="rgba(52, 73, 94, 0.8)" stroke="#34495e" stroke-width="1"/>
    <text x="0" y="-1" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ecf0f1" font-weight="bold">NMEA</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#ecf0f1">PROTOCOL</text>
  </g>
  
  <!-- UART Communication -->
  <g transform="translate(160, 110)">
    <rect x="-15" y="-6" width="30" height="12" rx="2" fill="rgba(155, 89, 182, 0.8)" stroke="#9b59b6" stroke-width="1"/>
    <text x="0" y="-1" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">UART</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">COMM</text>
  </g>
  
  <!-- Coordinate display -->
  <g transform="translate(100, 70)">
    <rect x="-25" y="-8" width="50" height="16" rx="3" fill="rgba(39, 174, 96, 0.9)" stroke="#27ae60" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">49.2827°N</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">123.1207°W</text>
  </g>
  
  <!-- Trilateration concept -->
  <g transform="translate(100, 90)" opacity="0.6">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#f1c40f" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="18" y="0" text-anchor="start" font-family="Arial, sans-serif" font-size="5" fill="#f1c40f">TRILATERATION</text>
  </g>
  
  <!-- Signal strength indicators -->
  <g transform="translate(30, 80)">
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">SIGNAL</text>
    <rect x="-8" y="0" width="3" height="6" fill="#27ae60"/>
    <rect x="-4" y="0" width="3" height="8" fill="#27ae60"/>
    <rect x="0" y="0" width="3" height="10" fill="#27ae60"/>
    <rect x="4" y="0" width="3" height="4" fill="#e74c3c"/>
  </g>
  
  <!-- Accuracy indicator -->
  <g transform="translate(170, 80)">
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ecf0f1">±3m</text>
    <circle cx="0" cy="5" r="8" fill="none" stroke="#27ae60" stroke-width="2"/>
    <circle cx="0" cy="5" r="2" fill="#27ae60"/>
  </g>
  
  <!-- Main title -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1" font-weight="bold">GPS MODULE</text>
  <text x="100" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">INTERFACE</text>
</svg>
