<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cmakeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cppGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- CMake triangle (simplified CMake logo) -->
  <g transform="translate(100, 85)">
    <!-- Main triangle -->
    <polygon points="-25,-20 25,-20 0,20" fill="url(#cmakeGradient)" stroke="#c0392b" stroke-width="1"/>
    
    <!-- Inner design lines -->
    <polygon points="-15,-10 15,-10 0,10" fill="none" stroke="#ecf0f1" stroke-width="1.5"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#ecf0f1" stroke-width="1"/>
  </g>
  
  <!-- C++ symbols -->
  <g transform="translate(70, 130)">
    <!-- C -->
    <path d="M 0,0 A 8,8 0 0,1 0,16 M 0,4 L 8,4 M 0,12 L 8,12" 
          fill="none" stroke="url(#cppGradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(85, 130)">
    <!-- First + -->
    <line x1="0" y1="4" x2="0" y2="12" stroke="url(#cppGradient)" stroke-width="2"/>
    <line x1="-4" y1="8" x2="4" y2="8" stroke="url(#cppGradient)" stroke-width="2"/>
  </g>
  
  <g transform="translate(95, 130)">
    <!-- Second + -->
    <line x1="0" y1="4" x2="0" y2="12" stroke="url(#cppGradient)" stroke-width="2"/>
    <line x1="-4" y1="8" x2="4" y2="8" stroke="url(#cppGradient)" stroke-width="2"/>
  </g>
  
  <!-- Build/gear icons -->
  <g transform="translate(130, 120)">
    <!-- Gear -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#95a5a6" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#95a5a6"/>
    <!-- Gear teeth -->
    <g stroke="#95a5a6" stroke-width="1.5">
      <line x1="0" y1="-10" x2="0" y2="-6"/>
      <line x1="7" y1="-7" x2="4.5" y2="-4.5"/>
      <line x1="7" y1="7" x2="4.5" y2="4.5"/>
      <line x1="0" y1="10" x2="0" y2="6"/>
      <line x1="-7" y1="7" x2="-4.5" y2="4.5"/>
      <line x1="-7" y1="-7" x2="-4.5" y2="-4.5"/>
    </g>
  </g>
  
  <!-- Modern/code brackets -->
  <g transform="translate(60, 60)" fill="#1abc9c" stroke="#16a085" stroke-width="1">
    <path d="M 0,0 L -5,5 L 0,10" fill="none" stroke-width="2"/>
  </g>
  
  <g transform="translate(140, 60)" fill="#1abc9c" stroke="#16a085" stroke-width="1">
    <path d="M 0,0 L 5,5 L 0,10" fill="none" stroke-width="2"/>
  </g>
  
  <!-- Project text -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ecf0f1" font-weight="bold">CMAKE</text>
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bdc3c7" font-weight="normal">BUILD SYSTEM</text>
</svg>
