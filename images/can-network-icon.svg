<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="canGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="busGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="signalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- CAN Bus (main horizontal line) -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="url(#busGradient)" stroke-width="4"/>
  
  <!-- Node 1 (Left MCU - TMS570LS1224) -->
  <g transform="translate(50, 100)">
    <!-- MCU chip -->
    <rect x="-15" y="-15" width="30" height="30" rx="3" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Pins/connections -->
    <rect x="-2" y="-18" width="4" height="6" fill="#34495e"/>
    <rect x="-8" y="-18" width="4" height="6" fill="#34495e"/>
    <rect x="4" y="-18" width="4" height="6" fill="#34495e"/>
    
    <!-- MCU Label -->
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ecf0f1" font-weight="bold">MCU1</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">1224</text>
    
    <!-- Connection to bus -->
    <line x1="0" y1="15" x2="0" y2="0" stroke="#ecf0f1" stroke-width="2"/>
  </g>
  
  <!-- Node 2 (Right MCU - TMS570LS1227) -->
  <g transform="translate(150, 100)">
    <!-- MCU chip -->
    <rect x="-15" y="-15" width="30" height="30" rx="3" fill="url(#nodeGradient)" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Pins/connections -->
    <rect x="-2" y="-18" width="4" height="6" fill="#34495e"/>
    <rect x="-8" y="-18" width="4" height="6" fill="#34495e"/>
    <rect x="4" y="-18" width="4" height="6" fill="#34495e"/>
    
    <!-- MCU Label -->
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ecf0f1" font-weight="bold">MCU2</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">1227</text>
    
    <!-- Connection to bus -->
    <line x1="0" y1="15" x2="0" y2="0" stroke="#ecf0f1" stroke-width="2"/>
  </g>
  
  <!-- CAN Transceivers -->
  <g transform="translate(50, 120)">
    <rect x="-8" y="0" width="16" height="10" rx="2" fill="url(#canGradient)" stroke="#c0392b" stroke-width="1"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white" font-weight="bold">MCP2551</text>
  </g>
  
  <g transform="translate(150, 120)">
    <rect x="-8" y="0" width="16" height="10" rx="2" fill="url(#canGradient)" stroke="#c0392b" stroke-width="1"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white" font-weight="bold">MCP2551</text>
  </g>
  
  <!-- Data transmission visualization -->
  <g transform="translate(100, 85)">
    <!-- Message packet -->
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="url(#signalGradient)" stroke="#16a085" stroke-width="1" opacity="0.8"/>
    
    <!-- Data bits representation -->
    <g stroke="#ecf0f1" stroke-width="1" fill="#ecf0f1">
      <rect x="-15" y="-5" width="2" height="10"/>
      <rect x="-10" y="-5" width="2" height="10"/>
      <rect x="-5" y="-5" width="2" height="10"/>
      <rect x="0" y="-5" width="2" height="10"/>
      <rect x="5" y="-5" width="2" height="10"/>
      <rect x="10" y="-5" width="2" height="10"/>
      <rect x="15" y="-5" width="2" height="10"/>
    </g>
    
    <!-- Direction arrows -->
    <polygon points="-25,0 -30,-3 -30,3" fill="#1abc9c" opacity="0.7"/>
    <polygon points="25,0 30,-3 30,3" fill="#1abc9c" opacity="0.7"/>
  </g>
  
  <!-- Bus termination resistors -->
  <g transform="translate(30, 100)">
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white" font-weight="bold">120Ω</text>
  </g>
  
  <g transform="translate(170, 100)">
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white" font-weight="bold">120Ω</text>
  </g>
  
  <!-- Signal representation (digital waves) -->
  <g transform="translate(100, 60)" stroke="#1abc9c" stroke-width="2" fill="none">
    <path d="M -20,0 L -15,0 L -15,-8 L -10,-8 L -10,0 L -5,0 L -5,-8 L 0,-8 L 0,0 L 5,0 L 5,-8 L 10,-8 L 10,0 L 15,0 L 15,-8 L 20,-8"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1abc9c" font-weight="bold">CAN Signal</text>
  </g>
  
  <!-- Network topology indicator -->
  <g transform="translate(100, 140)">
    <circle cx="-15" cy="0" r="3" fill="#f39c12"/>
    <circle cx="0" cy="0" r="3" fill="#f39c12"/>
    <circle cx="15" cy="0" r="3" fill="#f39c12"/>
    <line x1="-12" y1="0" x2="-3" y2="0" stroke="#f39c12" stroke-width="2"/>
    <line x1="3" y1="0" x2="12" y2="0" stroke="#f39c12" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#bdc3c7" font-weight="bold">BUS TOPOLOGY</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ecf0f1" font-weight="bold">CAN NETWORK</text>
  <text x="100" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bdc3c7">COMMUNICATION</text>
</svg>
